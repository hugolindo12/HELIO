<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEILO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23D98E1F'/%3E%3Cg stroke='%23D98E1F' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M6 26l3-3M23 9l3-3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF8F3; --side:#F2EFE7; --panel:#FFFFFF; --ink:#2B2723; --ink2:#6E675E; --ink3:#9A9288;
  --line:#E4DFD4; --bubble:#EFEBE2; --accent:#D98E1F; --accent2:#B8720F; --accentbg:#FBF1DE;
  --code:#F4F1EA; --danger:#B4452F; --ok:#3F7D4E; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 24px rgba(40,30,10,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1E1C; --side:#191816; --panel:#2A2926; --ink:#ECE8E1; --ink2:#B3ACA2; --ink3:#857E75;
  --line:#3A3834; --bubble:#34322E; --accent:#E9A23B; --accent2:#F2B65C; --accentbg:#3A2F1E;
  --code:#262522; --danger:#E0775F; --ok:#7DBB8A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#1F1E1C; --side:#191816; --panel:#2A2926; --ink:#ECE8E1; --ink2:#B3ACA2; --ink3:#857E75;
  --line:#3A3834; --bubble:#34322E; --accent:#E9A23B; --accent2:#F2B65C; --accentbg:#3A2F1E;
  --code:#262522; --danger:#E0775F; --ok:#7DBB8A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

/* ---------- sidebar ---------- */
#side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .2s}
body.fechada #side{margin-left:-268px}
.marca{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.marca b{font-size:20px;letter-spacing:.5px}
.sol{width:26px;height:26px;flex:none}
.btn-nova{margin:6px 12px 10px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);font-weight:550}
.btn-nova:hover{background:var(--bubble)}
.btn-nova .mais{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;line-height:1}
.rotulo{font-size:12px;color:var(--ink3);padding:8px 20px 4px;font-weight:600}
#lista{flex:1;overflow:auto;padding:0 8px}
.conv{display:flex;align-items:center;gap:4px;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--ink);cursor:pointer}
.conv span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv:hover{background:var(--bubble)}
.conv.ativa{background:var(--bubble);font-weight:550}
.conv .x{opacity:0;color:var(--ink3);padding:0 4px;font-size:16px}
.conv:hover .x{opacity:1}
.conv .x:hover{color:var(--danger)}
.rodape{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;text-align:left}
.item:hover{background:var(--bubble)}
.item .n{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}
.modelo{font-size:12.5px;color:var(--ink2);padding:6px 10px 2px;line-height:1.45}
.modelo b{color:var(--ink)}

/* ---------- main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topo{position:absolute;top:0;left:0;right:0;z-index:2;background:var(--bg);height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;flex:none}
.icone{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.icone:hover{background:var(--bubble);color:var(--ink)}
.titulo-conv{font-size:14.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rolagem{flex:1;overflow:auto;margin-top:52px}
#msgs{max-width:760px;margin:0 auto;padding:12px 24px 40px}
.m{margin:22px 0}
.m.user{display:flex;justify-content:flex-end}
.m.user .corpo{background:var(--bubble);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.m.bot{display:flex;gap:14px}
.m.bot .av{flex:none;margin-top:3px}
.m.bot .conteudo{flex:1;min-width:0}
.m.bot .corpo{word-wrap:break-word}
.corpo p{margin:0 0 .75em}
.corpo p:last-child{margin-bottom:0}
.corpo h1,.corpo h2,.corpo h3{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;margin:1em 0 .4em;line-height:1.3}
.corpo h1{font-size:1.4em}.corpo h2{font-size:1.25em}.corpo h3{font-size:1.1em}
.corpo ul,.corpo ol{margin:.2em 0 .8em;padding-left:1.5em}
.corpo li{margin:.2em 0}
.corpo a{color:var(--accent2)}
.corpo code{background:var(--code);border:1px solid var(--line);padding:.05em .35em;border-radius:5px;font:.88em ui-monospace,SFMono-Regular,Consolas,monospace}
.bloco{border:1px solid var(--line);border-radius:10px;margin:.6em 0 1em;overflow:hidden;background:var(--code)}
.bloco .cab{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);padding:6px 12px;border-bottom:1px solid var(--line)}
.bloco .cab button{font-size:12px;color:var(--ink2)}
.bloco pre{margin:0;padding:12px 14px;overflow:auto;font:13.5px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
.bloco pre code{background:none;border:0;padding:0;font-size:inherit}
.meta{font-size:12px;color:var(--ink3);margin-top:6px}
.acoes{display:flex;gap:2px;margin-top:6px;opacity:.0;transition:opacity .15s}
.m.bot:hover .acoes,.m.bot:last-child .acoes{opacity:1}
.acoes button{height:28px;padding:0 8px;border-radius:6px;color:var(--ink3);font-size:12.5px;display:flex;align-items:center;gap:5px}
.acoes button:hover{background:var(--bubble);color:var(--ink)}
.acoes button.feito{color:var(--ok)}
.erro .corpo{color:var(--danger)}
.pensando{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:14px}
.pensando .sol{animation:gira 2.4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cursor::after{content:"▍";color:var(--accent);animation:pisca 1s steps(2) infinite}
@keyframes pisca{50%{opacity:0}}

/* ---------- composer ---------- */
.base{flex:none;padding:0 24px 18px}
.caixa{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 12px 8px 16px;position:relative}
.caixa:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;max-height:240px;min-height:26px;padding:2px 0}
textarea::placeholder{color:var(--ink3)}
.linha{display:flex;align-items:center;gap:8px;margin-top:6px}
.linha .esp{flex:1}
select{font:inherit;font-size:13px;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer}
#enviar{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center}
#enviar:disabled{opacity:.35;cursor:default}
.aviso{max-width:760px;margin:8px auto 0;font-size:12px;color:var(--ink3);text-align:center}
#dicas{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;max-height:300px;overflow:auto}
#dicas div{padding:7px 10px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;gap:10px}
#dicas div b{min-width:92px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
#dicas div span{color:var(--ink2)}
#dicas div.sel,#dicas div:hover{background:var(--bubble)}

/* ---------- inicio ---------- */
body.vazia #rolagem{display:none}
body.vazia #main{justify-content:center}
body.vazia .base{padding-bottom:18vh}
#inicio{display:none;text-align:center;padding:0 24px 22px}
body.vazia #inicio{display:block}
#inicio h1{font-weight:400;font-size:clamp(28px,4vw,38px);margin:0 0 6px;display:flex;justify-content:center;align-items:center;gap:14px}
#inicio p{color:var(--ink2);margin:0}
.chips{max-width:760px;margin:14px auto 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
body:not(.vazia) .chips{display:none}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:13.5px;color:var(--ink2)}
.chips button:hover{color:var(--ink);border-color:var(--ink3)}

/* ---------- modal ---------- */
#fundo{position:fixed;inset:0;background:rgba(20,15,5,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#fundo.on{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(620px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal h2{margin:0;font-size:18px;padding:18px 20px 4px}
.modal .sub{color:var(--ink2);font-size:13.5px;padding:0 20px 10px}
.modal .cont{padding:4px 20px;overflow:auto;flex:1}
.modal label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.modal textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);min-height:70px}
.modal .pes{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px}
.b{white-space:nowrap;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:550;border:1px solid var(--line)}
.b.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.b.ruim{color:var(--danger)}
.cand{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.cand .q{color:var(--ink2)}
.cand .r{margin-top:4px;white-space:pre-wrap}
.cand .bs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cand .bs .b{padding:4px 10px;font-size:13px}
.cand .tag{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:760px){
  #side{position:fixed;z-index:5;height:100%;box-shadow:var(--shadow)}
  body:not(.fechada) #main::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:4}
  #msgs{padding:8px 16px 30px}.base{padding:0 16px 14px}
}
</style>
</head>
<body class="vazia">
<svg width="0" height="0" style="position:absolute">
  <symbol id="s-sol" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M16 2.5v4M16 25.5v4M2.5 16h4M25.5 16h4M6.4 6.4l2.9 2.9M22.7 22.7l2.9 2.9M6.4 25.6l2.9-2.9M22.7 9.3l2.9-2.9"/></g></symbol>
</svg>

<aside id="side">
  <div class="marca"><svg class="sol" style="color:var(--accent)"><use href="#s-sol"/></svg><b class="serif">HEILO</b></div>
  <button class="btn-nova" id="nova"><span class="mais">+</span> Nova conversa</button>
  <div class="rotulo">Conversas</div>
  <div id="lista"></div>
  <div class="rodape">
    <button class="item" id="abrir-ensinar">✎ Ensinar a HEILO</button>
    <button class="item" id="abrir-revisar">✓ Revisar aprendizados <span class="n" id="n-pend" hidden></span></button>
    <button class="item" id="tema">◐ Tema claro/escuro</button>
    <div class="modelo" id="modelo">carregando modelo…</div>
  </div>
</aside>

<main id="main">
  <div class="topo">
    <button class="icone" id="menu" title="Mostrar/ocultar conversas">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <div class="titulo-conv" id="titulo"></div>
  </div>

  <div id="rolagem"><div id="msgs"></div></div>

  <div id="inicio">
    <h1 class="serif"><svg class="sol" style="width:38px;height:38px;color:var(--accent)"><use href="#s-sol"/></svg><span id="saud">Olá, Hugo</span></h1>
    <p>Converse com a HEILO. Ela aprende com o que você ensinar e aprovar.</p>
  </div>

  <div class="base">
    <div class="caixa">
      <div id="dicas"></div>
      <textarea id="txt" rows="1" placeholder="Como posso ajudar? (digite / para comandos)"></textarea>
      <div class="linha">
        <select id="cerebro" title="Motor usado nas respostas">
          <option value="auto">Automático</option>
          <option value="seed">Só HEILO (modelo próprio)</option>
          <option value="teacher">Teacher (temporário)</option>
          <option value="off">Sem modelo (só conhecimento)</option>
          <optgroup label="Testar outra versão" id="grupo-versoes"></optgroup>
        </select>
        <div class="esp"></div>
        <button id="enviar" disabled title="Enviar (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <div class="chips">
      <button>Que dia é hoje?</button>
      <button>Quanto é 17% de 2.380?</button>
      <button>32 mm em polegadas</button>
      <button>Me lembra em 30 minutos de beber água</button>
      <button>Mostra a lista de compras</button>
      <button>Quem é você?</button>
    </div>
    <div class="aviso">A HEILO ainda está em treinamento e pode errar. Use 👍 e "Corrigir" para ensinar.</div>
  </div>
</main>

<div id="fundo"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const CHAVE = "heilo.conversas.v1";
const COMANDOS = [
  ["/ensinar", "pergunta => resposta — ensina um exemplo"],
  ["/cerebro", "auto | seed | teacher | off"],
  ["/status", "modelos, memória e conhecimento"],
  ["/metricas", "números reais do treino"],
  ["/memoria", "[busca] — memória local"],
  ["/aprender", "memória → validação → dataset"],
  ["/comparar", "pergunta — Seed × Teacher"],
  ["/gerar", "pergunta — exemplo do Teacher p/ revisão"],
];

/* ---------------- armazenamento ---------------- */
let convs = [];
try { convs = JSON.parse(localStorage.getItem(CHAVE) || "[]"); } catch (e) { convs = []; }
let atual = null, ocupado = false, versaoTeste = null, modoAtual = "auto";
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(convs.slice(0, 200))); } catch (e) {} }
function conv() { return convs.find(c => c.id === atual); }
function novaConv() {
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), titulo: "Nova conversa", msgs: [], t: Date.now() };
  convs.unshift(c); atual = c.id; return c;
}

/* ---------------- markdown seguro ---------------- */
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(texto) {
  const out = [], linhas = String(texto).replace(/\r/g, "").split("\n");
  let i = 0, para = [];
  const fechaPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  while (i < linhas.length) {
    const l = linhas[i];
    const f = l.match(/^\s*```\s*([\w+-]*)/);
    if (f) {
      fechaPara(); const cod = []; i++;
      while (i < linhas.length && !/^\s*```/.test(linhas[i])) cod.push(linhas[i++]);
      i++;
      out.push('<div class="bloco"><div class="cab"><span>' + esc(f[1] || "código") + '</span><button data-copiar>Copiar</button></div><pre><code>' + esc(cod.join("\n")) + "</code></pre></div>");
      continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) { fechaPara(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
      fechaPara(); const ord = /^\s*\d/.test(l); const itens = [];
      while (i < linhas.length && /^\s*([-*•]|\d+[.)])\s+/.test(linhas[i])) itens.push(linhas[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ""));
      out.push((ord ? "<ol>" : "<ul>") + itens.map(t => "<li>" + inline(t) + "</li>").join("") + (ord ? "</ol>" : "</ul>"));
      continue;
    }
    if (!l.trim()) { fechaPara(); i++; continue; }
    para.push(l); i++;
  }
  fechaPara();
  return out.join("");
}

/* ---------------- render ---------------- */
const SOL = '<svg class="sol" style="width:24px;height:24px;color:var(--accent)"><use href="#s-sol"/></svg>';
function nomeModelo(m) {
  if (!m) return "";
  if (m === "comando") return "comando";
  if (m === "ferramenta") return "ferramenta";
  if (m === "memoria") return "";
  if (/\(teste\)/.test(m)) return m;
  if (/seed/i.test(m)) return "HEILO Faísca";
  if (/teacher|qwen/i.test(m)) return "Teacher";
  return m;
}
function elMsg(m, idx) {
  const d = document.createElement("div");
  if (m.role === "user") {
    d.className = "m user";
    d.innerHTML = '<div class="corpo"></div>';
    d.querySelector(".corpo").textContent = m.content;
    return d;
  }
  d.className = "m bot" + (m.erro ? " erro" : "");
  const fonte = [nomeModelo(m.model), m.source && !/^model_|versao_teste/.test(m.source) ? m.source.replace(/^ferramenta:/, "") : ""].filter(Boolean).join(" · ");
  d.innerHTML = `<div class="av">${SOL}</div><div class="conteudo"><div class="corpo">${md(m.content)}</div>` +
    (fonte ? `<div class="meta">${esc(fonte)}</div>` : "") +
    `<div class="acoes">
      <button data-a="copiar" title="Copiar">⧉ Copiar</button>
      ${m.model !== "comando" && m.model !== "ferramenta" && !m.erro ? `<button data-a="boa" title="Aprovar esta resposta para o treino" class="${m.aprovada ? "feito" : ""}">👍 ${m.aprovada ? "Aprovada" : "Boa"}</button>
      <button data-a="corrigir" title="Ensinar a resposta certa">✎ Corrigir</button>
      <button data-a="refazer" title="Gerar de novo">↻ Refazer</button>` : ""}
    </div></div>`;
  d.dataset.idx = idx;
  return d;
}
function renderLista() {
  const L = $("#lista"); L.innerHTML = "";
  convs.forEach(c => {
    const d = document.createElement("div");
    d.className = "conv" + (c.id === atual ? " ativa" : "");
    d.innerHTML = '<span></span><button class="x" title="Apagar">×</button>';
    d.querySelector("span").textContent = c.titulo;
    d.onclick = e => {
      if (e.target.classList.contains("x")) {
        if (!confirmarApagar(c)) return;
        convs = convs.filter(x => x.id !== c.id); if (atual === c.id) atual = null; salvar(); render(); return;
      }
      atual = c.id; render(); if (innerWidth < 760) document.body.classList.add("fechada");
    };
    L.appendChild(d);
  });
}
function confirmarApagar(c) { return window.confirm ? window.confirm(`Apagar "${c.titulo}"?`) : true; }
function render() {
  renderLista();
  const c = conv();
  const vazia = !c || !c.msgs.length;
  document.body.classList.toggle("vazia", vazia);
  $("#titulo").textContent = vazia ? "" : c.titulo;
  const M = $("#msgs"); M.innerHTML = "";
  if (c) c.msgs.forEach((m, i) => M.appendChild(elMsg(m, i)));
  rolar();
}
function rolar() { const r = $("#rolagem"); r.scrollTop = r.scrollHeight; }
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 2600); }

/* ---------------- conversa ---------------- */
async function api(url, corpo) {
  const r = await fetch(url, corpo === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.json();
}
async function enviar(texto, historicoFixo) {
  texto = (texto ?? $("#txt").value).trim();
  if (!texto || ocupado) return;
  let c = conv() || novaConv();
  if (!historicoFixo) {
    c.msgs.push({ role: "user", content: texto });
    if (c.titulo === "Nova conversa") c.titulo = texto.slice(0, 48) + (texto.length > 48 ? "…" : "");
  }
  c.t = Date.now(); convs = [c, ...convs.filter(x => x.id !== c.id)];
  $("#txt").value = ""; ajustar(); salvar(); render();
  ocupado = true; $("#enviar").disabled = true;
  const pens = document.createElement("div");
  pens.className = "m bot"; pens.innerHTML = `<div class="pensando">${SOL} pensando…</div>`;
  $("#msgs").appendChild(pens); rolar();
  const hist = c.msgs.slice(0, -1).filter(m => !m.erro).map(m => ({ role: m.role, content: m.content }));
  let resp;
  try {
    const r = await api("/api/conversa", { message: texto, history: hist, versao: versaoTeste });
    resp = { role: "assistant", content: r.content || "(sem resposta)", model: r.model || "", source: r.source || "", erro: r.type === "erro" };
  } catch (e) {
    resp = { role: "assistant", content: "Não consegui falar com o servidor da HEILO. Ele está aberto? (" + e.message + ")", erro: true };
  }
  pens.remove();
  c.msgs.push(resp); salvar();
  await digitar(resp, c.msgs.length - 1);
  ocupado = false; atualizarBotao();
  if (/^\/(cerebro|ensinar)/.test(texto)) carregarModelo();
  if (/lembr|timer|avis/i.test(texto)) pedirNotificacao();
}
async function digitar(m, idx) {
  const el = elMsg({ ...m, content: "" }, idx); $("#msgs").appendChild(el);
  const corpo = el.querySelector(".corpo"); corpo.classList.add("cursor");
  const total = m.content.length, passo = Math.max(2, Math.ceil(total / 90));
  for (let i = 0; i < total; i += passo) {
    corpo.innerHTML = md(m.content.slice(0, i));
    rolar(); await new Promise(r => setTimeout(r, 14));
  }
  el.replaceWith(elMsg(m, idx)); rolar();
}

/* ---------------- ações das mensagens ---------------- */
$("#msgs").addEventListener("click", async e => {
  const cp = e.target.closest("[data-copiar]");
  if (cp) { navigator.clipboard?.writeText(cp.closest(".bloco").querySelector("code").textContent); cp.textContent = "Copiado"; setTimeout(() => cp.textContent = "Copiar", 1500); return; }
  const b = e.target.closest("[data-a]"); if (!b) return;
  const idx = +b.closest(".m").dataset.idx, c = conv(), m = c.msgs[idx];
  const pergunta = [...c.msgs.slice(0, idx)].reverse().find(x => x.role === "user")?.content || "";
  const a = b.dataset.a;
  if (a === "copiar") { navigator.clipboard?.writeText(m.content); toast("Copiado"); }
  if (a === "boa") {
    if (m.aprovada) return;
    try {
      const r = await api("/api/ensinar", { pergunta, resposta: m.content });
      if (r.ok) { m.aprovada = true; salvar(); render(); toast("Aprovada para o dataset. O Seed aprende no próximo treino."); }
      else toast("Não registrei: " + (r.errors || []).join("; "));
    } catch (err) { toast("Erro: " + err.message); }
  }
  if (a === "corrigir") abrirEnsinar(pergunta, m.content, () => { m.aprovada = false; });
  if (a === "refazer") {
    c.msgs.splice(idx); salvar(); render();
    if (pergunta) enviar(pergunta, true);
  }
});

/* ---------------- modais ---------------- */
function modal(html) { $("#modal").innerHTML = html; $("#fundo").classList.add("on"); }
function fecharModal() { $("#fundo").classList.remove("on"); }
$("#fundo").addEventListener("click", e => { if (e.target.id === "fundo") fecharModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal(); });

function abrirEnsinar(pergunta = "", resposta = "") {
  modal(`<h2>Ensinar a HEILO</h2>
    <div class="sub">Vira um exemplo aprovado no dataset e entra no conhecimento. Nenhum peso muda agora: o Seed aprende no próximo treino.</div>
    <div class="cont"><label>Pergunta</label><textarea id="e-p" rows="2"></textarea>
    <label>Resposta certa</label><textarea id="e-r" rows="6"></textarea></div>
    <div class="pes"><button class="b" id="e-c">Cancelar</button><button class="b pri" id="e-s">Ensinar</button></div>`);
  $("#e-p").value = pergunta; $("#e-r").value = resposta;
  (pergunta ? $("#e-r") : $("#e-p")).focus();
  $("#e-c").onclick = fecharModal;
  $("#e-s").onclick = async () => {
    try {
      const r = await api("/api/ensinar", { pergunta: $("#e-p").value, resposta: $("#e-r").value });
      if (r.ok) { fecharModal(); toast(r.ja_existia ? "Esse exemplo já existia." : "Ensinado! Entra no próximo treino."); }
      else toast("Não registrei: " + (r.errors || []).join("; "));
    } catch (err) { toast("Erro: " + err.message); }
  };
}
$("#abrir-ensinar").onclick = () => abrirEnsinar();

async function abrirRevisar() {
  modal(`<h2>Revisar aprendizados</h2><div class="sub">Candidatos vindos das conversas, do Teacher e de lotes escritos. Só o que você aprovar entra no treino.</div><div class="cont" id="rv">carregando…</div><div class="pes"><button class="b pri" id="rv-todos" hidden>✓ Aprovar todos que li</button><button class="b" onclick="fecharModal()">Fechar</button></div>`);
  let d;
  try { d = await api("/api/revisar"); } catch (e) { $("#rv").textContent = "Erro: " + e.message; return; }
  contarPendentes(d.pendentes.length);
  if (!d.pendentes.length) { $("#rv").innerHTML = "<p>Nada pendente. Converse com a HEILO e depois use <code>/aprender</code> para coletar candidatos.</p>"; return; }
  $("#rv").innerHTML = "";
  d.pendentes.forEach(p => {
    const q = [...p.messages].reverse().find(m => m.role === "user")?.content || "";
    const r = [...p.messages].reverse().find(m => m.role === "assistant")?.content || "";
    const el = document.createElement("div"); el.className = "cand";
    el.innerHTML = `<div class="tag"></div><div class="q"></div><div class="r"></div>
      <div class="bs"><button class="b" data-v="a">✓ Aprovar</button><button class="b" data-v="e">✎ Editar e aprovar</button><button class="b ruim" data-v="r">✕ Rejeitar</button></div>`;
    el.dataset.id = p.id;
    el.querySelector(".tag").textContent = [p.origem === "escrito_claude" ? "escrito pelo Claude" : p.origem, p.categoria].filter(Boolean).join(" · ");
    el.querySelector(".q").textContent = "Você: " + q;
    el.querySelector(".r").textContent = "HEILO: " + r;
    el.onclick = async e => {
      const v = e.target.dataset.v; if (!v) return;
      let corpo = { id: p.id, aprovar: v !== "r" };
      if (v === "e") {
        const box = el.querySelector(".r");
        if (!box.isContentEditable) { box.contentEditable = "true"; box.textContent = r; box.style.outline = "1px solid var(--accent)"; box.style.borderRadius = "6px"; box.style.padding = "4px"; box.focus(); e.target.textContent = "Salvar e aprovar"; return; }
        corpo.resposta = box.textContent.trim();
      }
      try {
        const res = await api("/api/revisar", corpo);
        if (res.ok === false) { toast(res.error || "não foi possível"); return; }
        el.remove(); toast(v === "r" ? "Rejeitado." : "Aprovado para o treino.");
        contarPendentes(document.querySelectorAll(".cand").length);
      } catch (err) { toast("Erro: " + err.message); }
    };
    $("#rv").appendChild(el);
  });
  const bt = $("#rv-todos"); bt.hidden = false;
  bt.onclick = async () => {
    const ids = [...document.querySelectorAll(".cand")].map(c => c.dataset.id);
    if (!ids.length) return;
    if (!confirm(`Aprovar os ${ids.length} candidatos da lista? Só faça isso se você leu e concorda com as respostas. Os que estiverem errados, rejeite ou edite antes.`)) return;
    bt.disabled = true; bt.textContent = "aprovando…";
    try {
      const r = await api("/api/revisar/lote", { ids, aprovar: true });
      toast(`${r.feitos} aprovado(s)` + (r.falhas ? `, ${r.falhas} com erro` : "") + ". Entram no próximo treino.");
      abrirRevisar();
    } catch (e) { toast("Erro: " + e.message); bt.disabled = false; }
  };
}
$("#abrir-revisar").onclick = abrirRevisar;
function contarPendentes(n) { const e = $("#n-pend"); e.hidden = !n; e.textContent = n; }

/* ---------------- modelo ---------------- */
async function carregarModelo() {
  try {
    const d = await api("/api/heilo");
    const pct = x => x == null ? "—" : (x * 100).toFixed(1) + "%";
    const at = (d.versoes || []).find(v => v.versao === d.ativa) || {};
    $("#modelo").innerHTML = `<b>HEILO ${esc(d.linha || "Faísca")} ${esc((d.ativa || "?").replace(/^(v|aurora-|zenite-)/, ""))}</b> · modo ${esc(d.modo)}<br>acerto no eval: ${pct(at.acerto)}` +
      (d.seed && d.seed.available === false ? `<br><span style="color:var(--danger)">${esc(d.seed.reason || "Seed indisponível")}</span>` : "");
    const sel = $("#cerebro"), g = $("#grupo-versoes");
    modoAtual = d.modo;
    g.innerHTML = (d.versoes || []).filter(v => v.no_pc && v.versao !== d.ativa).reverse()
      .map(v => `<option value="v:${esc(v.versao)}">HEILO ${esc(v.linha || "Faísca")} ${esc(v.versao.replace(/^(v|aurora-|zenite-)/, ""))} (${esc(v.status || "")}${v.acerto != null ? ", eval " + pct(v.acerto) : ""})</option>`).join("");
    g.hidden = !g.children.length;
    if (versaoTeste && [...sel.options].some(o => o.value === "v:" + versaoTeste)) sel.value = "v:" + versaoTeste;
    else if ([...sel.options].some(o => o.value === d.modo)) { versaoTeste = null; sel.value = d.modo; }
  } catch (e) { $("#modelo").textContent = "servidor offline"; }
}
$("#cerebro").onchange = async e => {
  const v = e.target.value;
  if (v.startsWith("v:")) {
    versaoTeste = v.slice(2);
    toast(`Testando o Seed ${versaoTeste}. Não muda a versão ativa; volte em "Automático" quando quiser.`);
    return;
  }
  versaoTeste = null;
  try { const r = await api("/api/cerebro", { texto: e.target.value }); toast(r.texto || "ok"); carregarModelo(); }
  catch (err) { toast("Erro: " + err.message); }
};

/* ---------------- composer ---------------- */
const txt = $("#txt");
function ajustar() { txt.style.height = "auto"; txt.style.height = Math.min(txt.scrollHeight, 240) + "px"; atualizarBotao(); dicas(); }
function atualizarBotao() { $("#enviar").disabled = ocupado || !txt.value.trim(); }
let dicaSel = 0;
function dicas() {
  const D = $("#dicas"), v = txt.value;
  if (!/^\/\S*$/.test(v)) { D.style.display = "none"; return; }
  const f = COMANDOS.filter(c => c[0].startsWith(v.toLowerCase()));
  if (!f.length) { D.style.display = "none"; return; }
  dicaSel = Math.min(dicaSel, f.length - 1);
  D.innerHTML = f.map((c, i) => `<div class="${i === dicaSel ? "sel" : ""}" data-c="${c[0]}"><b>${c[0]}</b><span>${esc(c[1])}</span></div>`).join("");
  D.style.display = "block";
}
$("#dicas").addEventListener("mousedown", e => { const d = e.target.closest("[data-c]"); if (d) { e.preventDefault(); txt.value = d.dataset.c + " "; ajustar(); txt.focus(); } });
txt.addEventListener("input", () => { dicaSel = 0; ajustar(); });
txt.addEventListener("keydown", e => {
  const D = $("#dicas");
  if (D.style.display === "block") {
    const itens = D.querySelectorAll("[data-c]");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); dicaSel = (dicaSel + (e.key === "ArrowDown" ? 1 : -1) + itens.length) % itens.length; dicas(); return; }
    const exato = txt.value.trim().toLowerCase() === itens[dicaSel].dataset.c;
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey && !exato)) { e.preventDefault(); txt.value = itens[dicaSel].dataset.c + " "; ajustar(); return; }
    if (exato) D.style.display = "none";   // comando já completo: Enter envia
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); enviar(); }
});
$("#enviar").onclick = () => enviar();
document.querySelectorAll(".chips button").forEach(b => b.onclick = () => enviar(b.textContent));
$("#nova").onclick = () => { atual = null; render(); txt.focus(); if (innerWidth < 760) document.body.classList.add("fechada"); };
$("#menu").onclick = () => document.body.classList.toggle("fechada");
$("#tema").onclick = () => {
  const r = document.documentElement, escuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = escuro ? "light" : "dark"; try { localStorage.setItem("heilo.tema", r.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem("heilo.tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const h = new Date().getHours();
$("#saud").textContent = (h < 5 ? "Boa noite" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + ", Hugo";
if (innerWidth < 760) document.body.classList.add("fechada");
render(); carregarModelo(); txt.focus();
api("/api/revisar").then(d => contarPendentes(d.pendentes.length)).catch(() => {});

/* ---------------- lembretes ---------------- */
function pedirNotificacao() { try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {} }
async function checarLembretes() {
  try {
    const d = await api("/api/lembretes/vencidos");
    for (const l of d.vencidos || []) {
      const t = "⏰ " + l.texto;
      toast(t); { const e = $("#toast"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 12000); }
      try { if ("Notification" in window && Notification.permission === "granted") new Notification("HEILO", { body: l.texto }); } catch (e) {}
      try { const a = new AudioContext(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 400); } catch (e) {}
      const c = conv() || novaConv();
      c.msgs.push({ role: "assistant", content: "⏰ **Lembrete:** " + l.texto, model: "ferramenta", source: "ferramenta:lembrete" });
      salvar(); render();
    }
  } catch (e) {}
}
setInterval(checarLembretes, 30000); checarLembretes();
</script>
