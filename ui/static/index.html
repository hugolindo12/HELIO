<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HEILO</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e9ef;
      --muted: #8b93a7; --accent: #5b8def; --accent2: #3dd68c;
      --warn: #f0b429; --danger: #f07178; --user: #1e2430; --agent: #141820;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { font-size: 1.15rem; font-weight: 600; }
    header h1 span { color: var(--accent); }
    .status { font-size: 0.8rem; color: var(--muted); display: flex; gap: 16px; align-items: center; }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); display: inline-block; margin-right: 6px; }
    main { flex: 1; display: flex; overflow: hidden; }
    #chat { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 820px; padding: 12px 16px; border-radius: 10px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border: 1px solid var(--border); }
    .msg.agent { align-self: flex-start; background: var(--agent); border: 1px solid var(--border); }
    .msg .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .msg.permission { border-color: var(--warn); background: #1a1608; }
    .perm-actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.85rem; font-weight: 500; }
    .btn-approve { background: var(--accent2); color: #0a1a12; }
    .btn-deny { background: var(--danger); color: #1a0a0a; }
    .btn-send { background: var(--accent); color: white; padding: 10px 18px; }
    .btn-chip { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; font-size: 0.75rem; border-radius: 999px; }
    .btn-chip:hover { border-color: var(--accent); color: var(--text); }
    #input-area { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
    .quick-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .input-row { display: flex; gap: 10px; }
    #input-area input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 0.95rem; outline: none; }
    #input-area input:focus { border-color: var(--accent); }
    #sidebar { width: 300px; background: var(--panel); padding: 16px; overflow-y: auto; font-size: 0.85rem; flex-shrink: 0; }
    #sidebar h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; margin-top: 18px; }
    #sidebar h3:first-child { margin-top: 0; }
    .side-item { padding: 6px 0; color: var(--text); border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .side-item span { color: var(--muted); }
    pre.steps { font-size: 0.75rem; color: var(--muted); margin-top: 8px; max-height: 140px; overflow: auto; background: #0c0e12; padding: 8px; border-radius: 6px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; background: #1e2a3a; color: var(--accent); margin-right: 4px; }
    .badge.ok { background: #0f2a1c; color: var(--accent2); }
    .badge.warn { background: #2a2208; color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <h1><span>HEILO</span> Platform</h1>
    <div class="status">
      <span><span class="dot"></span>Online</span>
      <span id="model-info">model: —</span>
      <span id="ws-info">workspace: —</span>
      <span id="tz-info">tz: —</span>
    </div>
  </header>
  <main>
    <div id="chat">
      <div id="messages"></div>
      <div id="input-area">
        <div class="quick-row">
          <button class="btn-chip" onclick="quick('Analise este projeto e encontre erros.')">Analisar projeto</button>
          <button class="btn-chip" onclick="quick('Rode os testes e gere um relatório.')">Rodar testes</button>
          <button class="btn-chip" onclick="quick('Corrija os bugs e rode os testes.')">Corrigir + testar</button>
          <button class="btn-chip" onclick="quick('Pesquise como calcular desconto em Python.')">Pesquisar</button>
          <button class="btn-chip" onclick="quick('Pesquise a solucao de desconto e aplique no projeto.')">Research+Code</button>
          <button class="btn-chip" onclick="quick('Pesquise a solucao de desconto, aplique no projeto e rode os testes.')">R+C+T</button>
        </div>
        <div class="input-row">
          <input id="user-input" type="text" placeholder="Digite sua mensagem..." autofocus />
          <button class="btn-send" onclick="send()">Enviar</button>
        </div>
      </div>
    </div>
    <aside id="sidebar">
      <h3>Status</h3>
      <div class="side-item" id="side-status">Carregando…</div>
      <h3>Agentes</h3>
      <div class="side-item" id="agents-list">—</div>
      <h3>MCP Servers</h3>
      <div class="side-item" id="mcp-list">—</div>
      <h3>Última tarefa</h3>
      <div class="side-item" id="last-task">—</div>
      <h3>Checkpoints</h3>
      <div class="side-item" id="checkpoints">—</div>
      <button class="btn-chip" style="margin-top:6px;width:100%;text-align:center;" onclick="rollbackLast()">↺ Reverter (Rollback)</button>
      <h3>RAG</h3>
      <div class="side-item" id="rag-info">—</div>
      <h3>Ferramentas</h3>
      <div id="tools-list" class="side-item">—</div>
    </aside>
  </main>
  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("user-input");
    function addMsg(role, content, extra = {}) {
      const div = document.createElement("div");
      div.className = "msg " + role + (extra.permission ? " permission" : "");
      let html = '<div class="meta">' + (role === "user" ? "Você" : (extra.agent || "HEILO")) + "</div>";
      if (extra.status) {
        const cls = extra.status === "success" ? "ok" : (extra.status === "waiting_permission" ? "warn" : "");
        html += '<span class="badge ' + cls + '">' + extra.status + "</span>";
      }
      html += "<div>" + escapeHtml(content) + "</div>";
      if (extra.permission) {
        html += '<div class="perm-actions">' +
          '<button class="btn-approve" onclick="approve(true)">Autorizar (sessão)</button>' +
          '<button class="btn-approve" onclick="approve(false)">Autorizar uma vez</button>' +
          '<button class="btn-deny" onclick="addMsg(\'agent\',\'Permissão negada.\')">Cancelar</button></div>';
      }
      if (extra.steps && extra.steps.length) {
        const lines = extra.steps.map(s => {
          const phase = s.phase ? "[" + s.phase + "] " : "";
          return phase + s.tool + " → " + (s.success ? "OK" : "FAIL");
        }).join("\n");
        html += '<pre class="steps">' + escapeHtml(lines) + "</pre>";
      }
      div.innerHTML = html;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function escapeHtml(t) {
      return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function quick(text) { inputEl.value = text; send(); }
    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      addMsg("user", text);

      const loadingDiv = document.createElement("div");
      loadingDiv.className = "msg agent";
      loadingDiv.innerHTML = '<div class="meta">HEILO</div><div><span class="badge">Iniciando...</span> Processando solicitação...</div>';
      messagesEl.appendChild(loadingDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const block of parts) {
            if (!block.trim()) continue;
            let eventType = "";
            let dataStr = "";
            for (const line of block.split("\n")) {
              if (line.startsWith("event: ")) eventType = line.substring(7).trim();
              if (line.startsWith("data: ")) dataStr = line.substring(6).trim();
            }
            if (eventType === "intent") {
              try {
                const parsed = JSON.parse(dataStr);
                loadingDiv.innerHTML = '<div class="meta">HEILO</div><div><span class="badge">' + escapeHtml(parsed.intent) + '</span> Executando ciclo...</div>';
              } catch (e) {}
            } else if (eventType === "result") {
              loadingDiv.remove();
              const data = JSON.parse(dataStr);
              if (data.type === "permission_request") {
                addMsg("agent", data.content, { agent: data.agent, permission: true, steps: data.steps, status: "waiting_permission" });
              } else {
                addMsg("agent", data.content || JSON.stringify(data), { agent: data.agent, steps: data.steps, status: data.status });
                if (data.task_id) {
                  document.getElementById("last-task").textContent = data.task_id + " (" + (data.status || data.agent || "") + ")";
                }
              }
              refreshStatus();
            }
          }
        }
      } catch (e) {
        loadingDiv.remove();
        addMsg("agent", "Erro de comunicação: " + e.message);
      }
    }

    async function rollbackLast() {
      if (!confirm("Deseja reverter as alterações para o último checkpoint registrado?")) return;
      try {
        const res = await fetch("/api/checkpoints/rollback", { method: "POST" });
        const data = await res.json();
        const msg = (data.count > 0)
          ? "Rollback concluído:\n" + data.restored.join("\n")
          : "Nenhum arquivo para restaurar.";
        addMsg("agent", msg);
        refreshStatus();
      } catch (e) {
        addMsg("agent", "Erro ao executar rollback: " + e.message);
      }
    }
    async function approve(session) {
      const res = await fetch("/api/approve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ grant_session: session }),
      });
      const data = await res.json();
      addMsg("agent", data.content || "Permissão processada.", { agent: data.agent, steps: data.steps, status: data.status });
      refreshStatus();
    }
    async function refreshStatus() {
      try {
        const res = await fetch("/api/status");
        const s = await res.json();
        document.getElementById("model-info").textContent = "model: " + s.model.provider + "/" + s.model.model_name;
        const parts = (s.workspace.root || "").split(/[/\\]/);
        if (s.timezone) {
          document.getElementById("tz-info").textContent =
            (s.timezone.user || "") + " · " + (s.timezone.now_local || "");
        }
        document.getElementById("ws-info").textContent = "workspace: " + parts.slice(-2).join("/");
        document.getElementById("side-status").innerHTML = "Arquivos: " + s.workspace.file_count + "<br>Permissões pendentes: " + s.pending_permissions;
        document.getElementById("agents-list").textContent = (s.agents || []).filter((a,i,arr) => arr.indexOf(a)===i).join(", ");
        document.getElementById("tools-list").textContent = (s.tools || []).join(", ");
        if (s.mcp_servers && s.mcp_servers.length) {
          document.getElementById("mcp-list").innerHTML = s.mcp_servers.map(m =>
            "<div>" + (m.name || m) + " <span>" + ((m.capabilities || []).length) + " tools</span></div>"
          ).join("");
        }
        document.getElementById("checkpoints").textContent =
          (s.checkpoints && s.checkpoints.length) ? s.checkpoints.map(c => c.id).slice(0,3).join(", ") : "nenhum";
        if (s.rag) {
          document.getElementById("rag-info").textContent = (s.rag.vector_docs || 0) + " docs · " + (s.rag.backend || "");
        }
      } catch (e) {}
    }
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    refreshStatus();
    addMsg("agent",
      "Olá. Eu sou a HEILO.\\n\\n" +
      "Agentes: HEILO CODE · HEILO TEST\\n" +
      "MCP: system · hl3d (stub) · blender (stub)\\n\\n" +
      "Use os atalhos abaixo ou digite livremente."
    );
  </script>
</body>
</html>
